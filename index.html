<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Perú Civilization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage"><div id="labels"></div></div>

  <!-- Menú inicial sobre la maqueta -->
  <section id="menu" class="menu" aria-label="Nueva partida">
    <div class="menu-panel">
      <header class="menu-head">
        <h1>Perú <span>Civilization</span></h1>
        <p class="tagline">Guía una cultura andina desde Caral hasta el siglo XXI. La historia real es el punto de partida; lo que pase después depende de ti.</p>
        <ol class="phases" aria-label="Fases del juego">
          <li class="on">Perú</li><li class="on">Sudamérica</li><li>América</li><li>El mundo</li>
        </ol>
      </header>
      <div class="menu-body">
        <fieldset class="step"><legend>Escenario</legend><div id="scenarios" class="seg"></div><p id="sc-desc" class="desc"></p></fieldset>
        <fieldset class="step"><legend>Cultura</legend><div id="cultures" class="culgrid"></div><p id="cu-desc" class="desc"></p></fieldset>
        <fieldset class="step"><legend>Dificultad</legend><div id="difficulties" class="seg"></div><p id="df-desc" class="desc"></p></fieldset>
        <div class="opts">
          <label for="opt-speed">Velocidad<select id="opt-speed"><option value="normal">Normal · unos 320 turnos</option><option value="rapida">Rápida · unos 160 turnos</option></select></label>
          <label for="opt-seed">Semilla del mapa<input id="opt-seed" type="number" inputmode="numeric" placeholder="Aleatoria"></label>
        </div>
      </div>
      <footer class="menu-actions">
        <button id="btn-start" class="btn primary big" type="button">Comenzar la historia</button>
        <button id="btn-continue" class="btn" type="button">Continuar partida</button>
        <button id="btn-load-file" class="btn ghost" type="button">Cargar archivo</button>
        <input id="file-load" type="file" accept=".json" hidden>
        <p id="menu-error" class="err" hidden></p>
        <p class="small"><a id="doc-link" href="docs/INVESTIGACION_HISTORICA.md" target="_blank" rel="noopener">Investigación histórica y demográfica</a></p>
      </footer>
    </div>
  </section>

  <!-- Interfaz de juego -->
  <section id="hud" hidden>
    <header id="topbar">
      <div class="civbadge" id="tb-civ"></div>
      <div class="stats">
        <div class="stat" id="tb-year"></div>
        <div class="stat" id="tb-gold"></div>
        <div class="stat wide" id="tb-sci"></div>
        <div class="stat" id="tb-cult"></div>
        <div class="stat" id="tb-stab"></div>
        <div class="stat" id="tb-reg"></div>
      </div>
      <nav class="nav" aria-label="Pantallas">
        <button class="navbtn" data-modal="techs" type="button"></button>
        <button class="navbtn" data-modal="diplo" type="button"></button>
        <button class="navbtn" data-modal="regions" type="button"></button>
        <button class="navbtn" data-modal="chronicle" type="button"></button>
        <button class="navbtn" data-modal="menu" type="button"></button>
      </nav>
    </header>
    <div id="toasts" aria-live="polite"></div>
    <div id="tooltip" hidden></div>
    <div id="mapctl" role="toolbar" aria-label="Cámara"></div>
    <aside id="side">
      <div id="panel"></div>
      <div class="endbar">
        <p id="end-status"></p>
        <button id="btn-end" class="btn primary big" type="button"></button>
      </div>
    </aside>
  </section>

  <div id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button class="close" id="modal-close" type="button" aria-label="Cerrar"></button><div id="modal-body"></div></div></div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/data/geo.js"></script>
  <script src="js/data/geo_sa.js"></script>
  <script src="js/data/rules.js"></script>
  <script src="js/data/civs.js"></script>
  <script src="js/core/mapgen.js"></script>
  <script src="js/core/game.js"></script>
  <script src="js/core/ai.js"></script>
  <script src="js/core/setup.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/diplomacy.js"></script>
  <script src="js/core/phases.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/render3d.js"></script>
  <script src="js/ui/ui.js"></script>
</body>
</html>
